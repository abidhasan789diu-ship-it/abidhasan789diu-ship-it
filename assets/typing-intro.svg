<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title desc">
<title id="title">Animated developer message ticker</title>
<desc id="desc">A clean neon ticker showing one message at a time, changing every two seconds, with an arrow prefix.</desc>
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/>
    <stop offset=".5" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#00E5FF"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="2" y="3" width="1196" height="70" rx="13" fill="#0D1422" stroke="#00DFFF" stroke-opacity=".55" stroke-width="2"/>
<path d="M20 15 V61" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
<g font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">
  <text x="610" y="47" opacity="0">➜ Software Developer | CSE Student<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.19;.20;.99;1" dur="10s" begin="0s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0">➜ IoT and Embedded Systems<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.19;.20;.99;1" dur="10s" begin="2s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0">➜ Building Practical Projects<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.19;.20;.99;1" dur="10s" begin="4s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0">➜ Code • Deploy • Debug • Repeat<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.19;.20;.99;1" dur="10s" begin="6s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0">➜ Learning • Building • Improving<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.19;.20;.99;1" dur="10s" begin="8s" repeatCount="indefinite"/></text>
</g>
<circle cx="1170" cy="38" r="5" fill="#00E5FF" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
</circle>
</svg>