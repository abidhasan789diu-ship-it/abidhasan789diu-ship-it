<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title desc">
<title id="title">Animated developer message ticker</title>
<desc id="desc">Neon message bar cycling through software development and IoT messages every second.</desc>
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00E5FF"/>
    <stop offset=".5" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#00E5FF"/>
    <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="2" y="3" width="1196" height="70" rx="13" fill="#0D1422" stroke="#00DFFF" stroke-opacity=".55" stroke-width="2"/>
<path d="M20 15 V61" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
<g font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">
  <text x="610" y="47" opacity="1"> &gt; Software Developer | CSE Student <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.16;.19;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0"> &gt; IoT and Embedded Systems <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.19;.35;.38;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0"> &gt; Building Practical Projects <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.38;.55;.58;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0"> &gt; Code • Deploy • Debug • Repeat <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.58;.75;.78;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
  <text x="610" y="47" opacity="0"> &gt; Learning • Building • Improving <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.78;.96;.99;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
</g>
<circle cx="1170" cy="38" r="5" fill="#00E5FF" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/>
</circle>
</svg>