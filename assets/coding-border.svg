<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="46" viewBox="0 0 1200 46" role="img" aria-labelledby="t d">
<title id="t">Animated coding border</title><desc id="d">Neon code symbols move continuously along a glowing coding rail.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00D9FF"/><stop offset=".5" stop-color="#9B5CFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path d="M12 23 H1188" stroke="#18334B" stroke-width="2"/><path d="M12 23 H1188" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="16 13" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-116" dur="3s" repeatCount="indefinite"/></path>
<g font-family="monospace" font-size="17" font-weight="700" fill="#00E5FF" filter="url(#glow)"><text y="18">&lt;/&gt;<animate attributeName="x" values="-90;1200" dur="12s" repeatCount="indefinite"/></text><text y="39" fill="#B77CFF">{}<animate attributeName="x" values="1200;-90" dur="15s" repeatCount="indefinite"/></text><text y="18" fill="#B77CFF">[ ]<animate attributeName="x" values="350;1450" dur="17s" repeatCount="indefinite"/></text><text y="39">&gt;_<animate attributeName="x" values="850;-150" dur="13s" repeatCount="indefinite"/></text></g>
<circle cx="12" cy="23" r="4" fill="#00E5FF" filter="url(#glow)"/><circle cx="1188" cy="23" r="4" fill="#B77CFF" filter="url(#glow)"/></svg>