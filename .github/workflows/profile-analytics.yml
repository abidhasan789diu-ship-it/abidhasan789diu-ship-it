name: Profile Analytics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate_graphs.py"
      - ".github/workflows/profile-analytics.yml"
      - "assets/**"
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate analytics SVGs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_graphs.py

      - name: Validate SVG files
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ("github-stats.svg", "languages.svg", "activity.svg"):
              path = Path("assets") / name
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f"Missing or empty SVG: {path}")
              root = ET.parse(path).getroot()
              if not root.tag.endswith("svg"):
                  raise SystemExit(f"Invalid SVG root in {path}")
              print(f"Validated {path}: {path.stat().st_size} bytes")
          PY

      - name: Commit and push updated charts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/languages.svg assets/activity.svg
          if git diff --cached --quiet; then
            echo "Analytics are already current."
            exit 0
          fi
          git commit -m "chore: update GitHub profile analytics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
